<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Arcane Archive</title><style> *{box-sizing:border-box}body{margin:0;background:#17191c;color:#eee8da;font:16px system-ui}header{position:sticky;top:0;background:#202226;padding:15px;z-index:2;border-bottom:1px solid #665638}h1{font:26px Georgia;color:#e1c18a;margin:0 0 12px}button,input,select{font:inherit;border:1px solid #665638;border-radius:8px;padding:10px;background:#292b30;color:#eee8da}button{cursor:pointer}button.primary{background:#d6b477;color:#211a12;font-weight:bold} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{min-width:0;flex:1}main{padding:16px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.card{position:relative;background:#24262a;border-radius:10px;padding:7px;overflow:hidden}.card img{width:100%;aspect-ratio:0.716;object-fit:contain;border-radius:8px;background:#333}.card button{width:100%;margin-top:5px}.badge{position:absolute;right:8px;top:8px;background:#25202b;border:1px solid gold;border-radius:8px;padding:5px}.muted{color:#b8b2a5;font-size:13px}dialog{background:#202226;color:#eee8da;border:1px solid #8e7448;border-radius:12px;width:min(94vw,720px);max-height:88vh;overflow:auto;padding:18px}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}label select,label input{display:block;width:100%;margin-top:5px}h2{font:24px Georgia;color:#e1c18a}#deckbar{margin:12px 0} .empty{padding:35px 12px;text-align:center;color:#b8b2a5} .scanprints img{display:block;width:100%;height:auto;object-fit:contain}.scanprints button{flex:0 0 110px;overflow:hidden;white-space:normal}dialog{max-width:94vw} </style></head><body><header><h1>✦ Arcane Archive</h1><div class=row><input id=q placeholder="Search your collection" oninput="render()"><button onclick="decks()">☰ My Decks</button><button class=primary onclick="add()">+ Add cards</button></div></header><main><div class=row><select id=condition onchange=render()><option value="">All conditions</option><option>Near Mint</option><option>Lightly Played</option><option>Moderately Played</option><option>Heavily Played</option><option>Damaged</option></select><select id=finish onchange=render()><option value="">All finishes</option><option>nonfoil</option><option>foil</option><option>etched</option></select><select id=df onchange=render()></select><button onclick="createDeck()">+ Deck</button><button onclick="scan()">Photo / scan</button><button onclick="bulk()">Bulk assign</button><button onclick="selectFiltered()">Select all filtered</button><button onclick="selected.clear();render()">Clear selection</button><span id=selection class=muted></span><button onclick="backup()">Export</button><button onclick="document.getElementById('import').click()">Import</button><input type=file id=import hidden accept='.json' onchange=restore(event)></div><button id=back hidden onclick="active='';$('df').value='';$('q').value='';$('color').value='';$('keyword').value='';$('condition').value='';$('finish').value='';selected.clear();render()">← Back to My Collection</button><div class=row style="margin-top:12px"><select id=color onchange=render()><option value="">All colors</option><option value=W>White</option><option value=U>Blue</option><option value=B>Black</option><option value=R>Red</option><option value=G>Green</option><option value=M>Multicolored</option><option value=C>Colorless</option></select><input id=keyword placeholder="Abilities or rules text" oninput=render()><button id=metadata onclick=hydrate()>Load card details</button></div><p id=metaStatus class=muted></p><button id=suggest hidden onclick=recommend()>✦ Suggested cards</button><h2 id=heading>My Collection</h2><p id=count class=muted></p><div id=grid class=grid></div></main><dialog id=modal></dialog><script>
const $=id=>document.getElementById(id),m=$('modal');let state={cards:[],decks:[]},active='',selected=new Set();try{state=JSON.parse(localStorage.getItem('arcane-v1'))||state}catch(e){}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('arcane-v1',JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup before closing.')}render()}function open(html){m.innerHTML=html;if(!m.open)m.showModal()}function closeM(){m.close()}const closeBtn='<button onclick="closeM()">Close</button>';function image(c){return `<img loading="eager" src="${esc(c.img)}" alt="${esc(c.name)}" onerror="if(this.dataset.retry){this.alt='Image unavailable';return}this.dataset.retry=1;this.src='${esc(c.altimg||c.img)}'">`}function render(){$('back').hidden=!active;let f=$('df').value;$('df').innerHTML='<option value="">All decks</option><option value="none">Not in a deck</option>'+state.decks.map(d=>`<option value="${d.id}">${esc(d.icon+' '+d.name)}</option>`).join('');$('df').value=f;let a=visibleCards(f);$('suggest').hidden=!active;updateSelection();$('heading').textContent=active?state.decks.find(d=>d.id===active)?.name||'My Collection':'My Collection';$('count').textContent=`${a.length} entries · ${a.reduce((s,c)=>s+(active?c.assign[active]:c.qty),0)} cards`;$('grid').innerHTML=a.length?a.map(c=>`<div class=card>${image(c)}<span class=badge>${state.decks.filter(d=>c.assign?.[d.id]).map(d=>esc(d.icon)).join('')}</span><strong>${esc(c.name)}</strong><div class=muted>${esc(c.set)} #${esc(c.num)} · ${esc(c.finish)}<br>${esc(c.condition)} · ×${active?c.assign[active]:c.qty}<br>${price(c)}</div><button onclick="detail('${c.id}')">Details</button><label class=muted><input type=checkbox ${selected.has(c.id)?'checked':''} onchange="this.checked?selected.add('${c.id}'):selected.delete('${c.id}');updateSelection()"> Select</label></div>`).join(''):'<div class=empty>No cards here yet. Add cards to begin.</div>'}function price(c){return c.price?`Printing reference: $${esc(c.price)} (not condition-specific)`:'Price unavailable'}function norm(s){return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g,"")}function add(){open(`<h2>Add a card</h2><form onsubmit="event.preventDefault();searchCards()"><div class=row><input id=search placeholder="Card name, set or collector number" required><button class=primary>Search</button></div></form><p class=muted>Search by name, or use set: and cn: for uncertain printings.</p><div id=results></div>${closeBtn}`)}let found=[];async function searchCards(){let s=$('search').value.trim();$('results').textContent='Finding printings…';try{let query=s.includes(':')?s:s.replace(/[’'",.!?]/g," ").trim().split(/\s+/).map(w=>`name:${JSON.stringify(w)}`).join(" ");let url='https://api.scryfall.com/cards/search?unique=prints&q='+encodeURIComponent(query);found=[];for(let i=0;url&&i<5;i++){let r=await fetch(url);let j=await r.json();if(!r.ok){if(i===0&&r.status===404&&!s.includes(':')){let fr=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(s));let fc=await fr.json();if(fr.ok){url='https://api.scryfall.com/cards/search?unique=prints&q='+encodeURIComponent('!'+JSON.stringify(fc.name));continue}}throw Error(j.details||'Search failed');}found.push(...j.data);url=j.has_more?j.next_page:null} $('results').innerHTML=`<p>${found.length} printings</p><div class=grid>`+found.map((c,i)=>`<div class=card onclick="choose(${i})">${image(normal(c))}<strong>${esc(c.name)}</strong><div class=muted>${esc(c.set_name)} #${esc(c.collector_number)}</div><button>Choose</button></div>`).join('')+'</div>'}catch(e){$('results').textContent='Could not load cards: '+e.message+' Try again in Safari with internet access.'}}function normal(c){let im=c.image_uris||c.card_faces?.[0]?.image_uris||{};return {name:c.name,img:im.normal,altimg:im.large,set:c.set_name,num:c.collector_number,sid:c.id,...metadata(c)}}function choose(i){let c=found[i];open(`<h2>${esc(c.name)}</h2><div style="max-width:210px;margin:auto">${image(normal(c))}</div><p>${esc(c.set_name)} #${esc(c.collector_number)}</p><label>Finish<select id=af>${c.finishes.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><label>Condition<select id=ac>${['Near Mint','Lightly Played','Moderately Played','Heavily Played','Damaged'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Quantity<input id=aq type=number min=1 value=1></label><p class=muted>Condition-specific live ranges are not available in this prototype. Printing reference price is saved when available.</p><button class=primary onclick="commit(${i})">Add to collection</button> <button onclick=add()>Back to search</button>`)}function commit(i){let c=found[i],finish=$('af').value,condition=$('ac').value,qty=Math.max(1,Math.floor(Number($('aq').value)||1)),p=c.prices?.[finish==='nonfoil'?'usd':finish==='foil'?'usd_foil':'usd_etched'];let old=state.cards.find(x=>x.sid===c.id&&x.finish===finish&&x.condition===condition);if(old){old.qty+=qty;old.price=p}else state.cards.push({...normal(c),id:uid(),finish,condition,qty,price:p,assign:{}});save();if(scanQueue.length)nextScan();else closeM()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}function createDeck(){open(`<h2>Create deck</h2><label>Name<input id=dn></label><label>Format<select id=fmt><option>Commander</option><option>Standard</option><option>Modern</option><option>Casual</option><option>Other</option></select></label><label>Deck emoji (use your emoji keyboard)<input id=di value="🐉" maxlength=32></label><button class=primary onclick="if($('dn').value.trim()){state.decks.push({id:uid(),name:$('dn').value.trim(),format:$('fmt').value,icon:$('di').value});save();decks()}">Save deck</button> ${closeBtn}`)}function decks(){open(`<h2>My Decks</h2><button onclick="active='';render();closeM()">All collection</button><p>${state.decks.map(d=>`<button style="display:block;width:100%;margin:8px 0" onclick="active='${d.id}';render();closeM()">${esc(d.icon+' '+d.name)} · ${esc(d.format)} · ${state.cards.reduce((s,c)=>s+(c.assign?.[d.id]||0),0)} cards</button>`).join('')}</p>${state.decks.map(d=>`<button onclick="editIcon('${d.id}')">Edit ${esc(d.name)} icon</button>`).join(" ")}<button class=primary onclick=createDeck()>+ Create deck</button> ${closeBtn}`)}function editIcon(id){let d=state.decks.find(x=>x.id===id);open(`<h2>Edit deck icon</h2><label>Emoji<input id=ei maxlength=32 value="${esc(d.icon)}"></label><button class=primary onclick="state.decks.find(x=>x.id==='${id}').icon=$('ei').value.trim()||'🐉';save();decks()">Save icon</button> ${closeBtn}`)}
let scanRows=[],scanImage=null,scanRun=0;let scanQueue=[];
function scan(){scanRun++;scanRows=[];scanImage=null;scanDeck="";open(`<h2>Bulk photo / scan · V8</h2><p>Arrange upright cards in an evenly spaced grid. Crop the photo close to the outside edges of the cards before uploading.</p><label>Layout<select id=layout onchange="drawScan()"><option value=3>9 cards (3 × 3)</option><option value=2>4 cards (2 × 2)</option><option value=1>1 card</option></select></label><input type=file id=photo accept="image/*" onchange="loadScanPhoto()"><p id=scanstatus></p><canvas id=scanPreview style="width:100%;display:none"></canvas><label><input type=checkbox id=autoEdges checked> Automatically straighten cards (experimental)</label><label><input type=checkbox id=titleCheck checked> Cross-check card titles (slower)</label><label>Outer margin (%) <input id=margin type=number min=0 max=15 value=3 onchange="drawScan()"></label><label>Artwork candidate pool (optional set codes, separated by spaces)<input id=artsets placeholder="e.g. m19 tdm ltr"></label><p class=muted>Compares artwork against your collection and selected sets. Title recognition supplies additional candidates. The limited mode is separate from the universal index.</p><button class=primary onclick="universalScan()">Search universal artwork index (beta)</button><button onclick="artScan()">Limited artwork + titles</button><button onclick="readScan()">Titles only</button><div id=scanReview></div> ${closeBtn}`)}
async function loadScanPhoto(){let f=$('photo').files[0];if(!f)return;let u=URL.createObjectURL(f);try{let im=new Image();im.src=u;await im.decode();scanImage=im;drawScan()}catch(e){$('scanstatus').textContent='Cannot open image. Try a JPEG or screenshot.'}finally{URL.revokeObjectURL(u)}}
function scanGeometry(){let n=Number($('layout').value),p=Math.max(0,Math.min(15,Number($('margin').value)||0))/100,w=scanImage.width,h=scanImage.height;return {n,x:w*p,y:h*p,cw:w*(1-2*p)/n,ch:h*(1-2*p)/n}}
function drawScan(){if(!scanImage)return;let c=$('scanPreview'),g=scanGeometry();c.width=Math.min(900,scanImage.width);c.height=c.width*scanImage.height/scanImage.width;c.style.display='block';let ctx=c.getContext('2d'),s=c.width/scanImage.width;ctx.drawImage(scanImage,0,0,c.width,c.height);ctx.strokeStyle='#65ff9b';ctx.lineWidth=2;for(let i=0;i<g.n*g.n;i++){let x=g.x+i%g.n*g.cw,y=g.y+Math.floor(i/g.n)*g.ch;ctx.strokeRect(x*s,y*s,g.cw*s,g.ch*s);ctx.strokeRect((x+g.cw*.04)*s,(y+g.ch*.015)*s,g.cw*.83*s,g.ch*.13*s)}}
function cropScan(g,i,title){let c=document.createElement('canvas'),x=g.x+i%g.n*g.cw,y=g.y+Math.floor(i/g.n)*g.ch;let w=g.cw,h=g.ch;if(title){x+=w*.04;y+=h*.015;w*=.83;h*=.13}c.width=title?1100:240;c.height=Math.round(c.width*h/w);let ctx=c.getContext('2d');ctx.drawImage(scanImage,x,y,w,h,0,0,c.width,c.height);if(title){let d=ctx.getImageData(0,0,c.width,c.height);for(let j=0;j<d.data.length;j+=4){let v=Math.max(0,Math.min(255,(.299*d.data[j]+.587*d.data[j+1]+.114*d.data[j+2]-128)*1.35+128));d.data[j]=d.data[j+1]=d.data[j+2]=v}ctx.putImageData(d,0,0)}return c}
async function readScan(){if(!scanImage){$('scanstatus').textContent='Choose a photo first.';return}let run=++scanRun,g=scanGeometry(),status=$('scanstatus'),worker;scanRows=[];try{status.textContent='Loading recognition engine…';if(!window.Tesseract)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'7'});for(let i=0;i<g.n*g.n;i++){if(run!==scanRun||!m.open)return;status.textContent=`Reading card ${i+1} of ${g.n*g.n}…`;let thumb=cropScan(g,i,false).toDataURL('image/jpeg',.8),raw='';try{raw=(await worker.recognize(cropScan(g,i,true))).data.text.trim().replace(/\s+/g,' ')}catch(e){}scanRows.push({thumb,raw,name:raw,prints:[],pick:-1,finish:'nonfoil',condition:'Near Mint',qty:1});if(raw)await resolveScan(i,false)}status.textContent='Review each match and choose the exact printing.';renderScanReview()}catch(e){status.textContent='Recognition failed: '+e.message+'. You can still enter card names manually.';if(!scanRows.length)for(let i=0;i<g.n*g.n;i++)scanRows.push({thumb:cropScan(g,i,false).toDataURL(),name:'',prints:[],pick:-1,finish:'nonfoil',condition:'Near Mint',qty:1});renderScanReview()}finally{if(worker)await worker.terminate()}}
async function resolveScan(i,redraw=true){let r=scanRows[i];r.pick=-1;r.prints=[];r.error='';try{let a=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(r.name));if(!a.ok)throw Error('No match');let c=await a.json();r.name=c.name;await new Promise(ok=>setTimeout(ok,120));let b=await fetch(c.prints_search_uri);if(!b.ok)throw Error('Printings unavailable');let j=await b.json();r.prints=j.data||[];while(j.has_more&&j.next_page){await new Promise(ok=>setTimeout(ok,120));let next=await fetch(j.next_page);if(!next.ok)break;j=await next.json();r.prints.push(...j.data)}if(r.prints.length===1)r.pick=0}catch(e){r.error='Check name and retry.'}if(redraw)renderScanReview()}
function renderScanReview(){let el=$('scanReview');if(!el)return;let conditions=['Near Mint','Lightly Played','Moderately Played','Heavily Played','Damaged'];el.innerHTML=`<h2>Review ${scanRows.length} cards</h2><label>Apply condition to all<select onchange="scanRows.forEach(r=>r.condition=this.value);renderScanReview()">${conditions.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Apply finish to all<select onchange="scanRows.forEach(r=>r.finish=this.value);renderScanReview()"><option>nonfoil</option><option>foil</option><option>etched</option></select></label><label>Assign to deck<select id=scanDeck onchange="scanDeck=this.value"><option value="">Collection only</option>${state.decks.map(d=>`<option value="${esc(d.id)}" ${scanDeck===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`+scanRows.map((r,i)=>`<section style="border-top:1px solid #665638;padding:12px 0"><div class=row><img src="${r.thumb}" style="width:85px"><div style="flex:1;min-width:0"><input style="width:100%" value="${esc(r.name)}" onchange="scanRows[${i}].name=this.value;scanRows[${i}].pick=-1;scanRows[${i}].prints=[]"><button onclick="resolveScan(${i})">Find printings</button><p class=muted>${esc(r.error||r.visualNote||'Choose exact printing')}</p></div></div><div class=scanprints style="display:flex;overflow:auto;gap:8px">${r.prints.map((c,k)=>`<button style="min-width:110px;width:110px;padding:4px;border:2px solid ${r.pick===k?'#65ff9b':'#665638'}" onclick="pickScan(${i},${k})">${image(normal(c))}<small>${esc(c.set_name)} #${esc(c.collector_number)}</small></button>`).join('')}</div><div class=row><select onchange="scanRows[${i}].condition=this.value">${conditions.map(x=>`<option ${r.condition===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="scanRows[${i}].finish=this.value">${['nonfoil','foil','etched'].map(x=>`<option ${r.finish===x?'selected':''}>${x}</option>`).join('')}</select><input aria-label="Quantity" type=number min=1 value="${r.qty}" style="width:65px" onchange="scanRows[${i}].qty=Math.max(1,Math.floor(Number(this.value)||1))"></div><label><input type=checkbox ${r.skip?'checked':''} onchange="scanRows[${i}].skip=this.checked"> Skip this card</label></section>`).join('')+`<button class=primary onclick="commitScan()">Confirm & add selected cards</button>`}

const artWait=ms=>new Promise(r=>setTimeout(r,ms));
function artVector(im,box){let c=document.createElement('canvas');c.width=16;c.height=12;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,...box,0,0,16,12);let a=x.getImageData(0,0,16,12).data,v=[];for(let i=0;i<a.length;i+=4){let r=a[i],g=a[i+1],b=a[i+2];v.push((r+g+b)/3,(r-g)*.65,(b-g)*.65)}let mean=v.filter((_,i)=>i%3===0).reduce((a,b)=>a+b,0)/192;for(let i=0;i<v.length;i+=3)v[i]-=mean;let n=Math.sqrt(v.reduce((a,b)=>a+b*b,0))||1;return v.map(x=>x/n)}
function artVectors(im){let w=im.width,h=im.height;return [[.09,.13,.82,.40],[.11,.15,.78,.36],[.06,.11,.88,.44]].map(b=>artVector(im,[b[0]*w,b[1]*h,b[2]*w,b[3]*h]))}
function artScore(a,b){return Math.max(...a.flatMap(x=>b.map(y=>x.reduce((n,z,i)=>n+z*y[i],0))))}
async function artLoad(url){let im=new Image();im.crossOrigin='anonymous';im.src=url;await Promise.race([im.decode(),new Promise((_,no)=>setTimeout(()=>no(Error('Image timeout')),10000))]);return im}
async function artFetch(url){await artWait(130);let r=await fetch(url);if(!r.ok)throw Error('Scryfall '+r.status);return r.json()}
async function artScan(){if(!scanImage)return;let run=++scanRun,g=scanGeometry(),status=$('scanstatus'),sets=$('artsets').value.toLowerCase().match(/[a-z0-9]+/g)||[],pool=new Map(),vectors=[],worker;scanRows=[];$('scanReview').innerHTML='';let alive=()=>run===scanRun&&m.open;try{for(let i=0;i<g.n*g.n;i++){let c=cropScan(g,i,false);vectors.push(artVectors(c));scanRows.push({thumb:c.toDataURL('image/jpeg',.85),name:'',prints:[],pick:-1,finish:'nonfoil',condition:'Near Mint',qty:1})}for(let c of state.cards){if(c.sid&&c.img)pool.set(c.sid,{id:c.sid,name:c.name,url:c.img})}status.textContent='Reading title clues…';try{if(!window.Tesseract)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'7'});for(let i=0;i<scanRows.length&&alive();i++){let r=scanRows[i];try{r.name=(await worker.recognize(cropScan(g,i,true))).data.text.trim().replace(/[^a-zA-Z0-9 '\-]/g,' ').replace(/\s+/g,' ');if(r.name){await resolveScan(i,false);for(let c of r.prints){let n=normal(c);if(n.img)pool.set(c.id,{id:c.id,name:c.name,url:n.img,c})}}}catch(e){}}}catch(e){}finally{if(worker)await worker.terminate()}if(!alive())return;for(let set of sets.slice(0,4)){try{let url='https://api.scryfall.com/cards/search?unique=prints&q='+encodeURIComponent('set:'+set+' game:paper');while(url&&pool.size<1500&&alive()){let j=await artFetch(url);for(let c of j.data||[]){let n=normal(c);if(n.img)pool.set(c.id,{id:c.id,name:c.name,url:n.img,c})}url=j.has_more?j.next_page:null}}catch(e){status.textContent='Some set candidates unavailable.'}}let candidates=[...pool.values()],rank=scanRows.map(()=>[]),done=0,failed=0;for(let offset=0;offset<candidates.length&&alive();offset+=5){await Promise.all(candidates.slice(offset,offset+5).map(async p=>{try{let im=await artLoad(p.url),v=artVectors(im);
