function sleeve154(){let d=state.decks.find(x=>x.id===active),a=d.appearance153||{};sleeveDraft153=a.sleeve154||'';open(`<h2>Card sleeves</h2><input type=file accept="image/*" onchange="readSleeve153(this)"><img id=sleevePreview153 class="appearancePreview153 sleevePreview114" ${sleeveDraft153?'src="'+esc(sleeveDraft153)+'"':'hidden'}><button onclick="sleeveDraft153=state.decks.find(x=>x.id===active).appearance153?.img||'';if(sleeveDraft153){$('sleevePreview153').src=sleeveDraft153;$('sleevePreview153').hidden=false;previewSleeve114()}">Use background image</button><p class=muted>Automatically cropped to card proportions. Original image retained.</p><label>Horizontal crop position<input id=cropX114 type=range min=0 max=100 value="${a.cropX114??50}" oninput="previewSleeve114()"></label><label>Vertical crop position<input id=cropY114 type=range min=0 max=100 value="${a.cropY114??50}" oninput="previewSleeve114()"></label><button class=primary onclick="saveSleeve154()">Save sleeve</button><button onclick="sleeveDraft153='';saveSleeve154()">Use standard Magic back</button>`);previewSleeve114()}
function saveSleeve154(){let d=state.decks.find(x=>x.id===active),old=d.appearance153;d.appearance153={...old,sleeve154:sleeveDraft153,cropX114:Number($('cropX114')?.value??50),cropY114:Number($('cropY114')?.value??50)};try{localStorage.setItem('arcane-v1',JSON.stringify(state))}catch(e){d.appearance153=old;alert('Storage full. Export a backup first.');return}render();closeM()}

function money16(n){return '$'+Number(n).toFixed(2)}
function value16(c){if(c.manual166!=null)return [c.manual166,c.manual166];let p=Number(c.price);if(!Number.isFinite(p)||p<=0)return null;let f=({'Near Mint':[.85,1.1],'Lightly Played':[.7,.95],'Moderately Played':[.5,.8],'Heavily Played':[.3,.6],'Damaged':[.1,.4]})[c.condition]||[.5,1];return f.map(x=>p*x)}
function prefs16(){return {threshold:10,increase:25,fee:13,...state.marketPrefs16,threshold:state.marketPrefs16?.valuable124??10}}
function toggleNav16(force){let on=typeof force==='boolean'?force:!document.body.classList.contains('navOpen16');document.body.classList.toggle('navOpen16',on);$('veil16').hidden=!on}
function navigate16(id){marketView16=id==='market';active=marketView16?'':id;for(let k of ['q','df','color','keyword','condition','finish','gcFilter'])$(k).value='';selected.clear();toggleNav16(false);render()}
function trade16(c){return c.trade16||{status:'None',qty:0}}
function available16(c){return Math.max(0,Number(c.qty||0)-Object.values(c.assign||{}).reduce((a,b)=>a+Number(b||0),0))}
function change16(c){let h=c.history16||[],last=h[h.length-1],old=h.find(x=>last&&x.t<last.t&&x.t>=last.t-30*86400000);return old&&old.p>0?(last.p/old.p-1)*100:null}
function flagged16(c){let v=value16(c),p=prefs16(),ch=change16(c);return !!v&&(v[0]+v[1])/2>=p.threshold}
function marketDetail16(c){let t=trade16(c),v=value16(c),ch=change16(c);return `<div class=marketBox16><h3>✦ Market & trade</h3><p>${v?money16(v[0])+' – '+money16(v[1]):'No printing reference available'} · heuristic estimate</p><p class=muted>${c.priceChecked16?'Reference refreshed '+new Date(c.priceChecked16).toLocaleDateString():'Reference date unknown'}${ch===null?' · No recorded trend':' · '+ch.toFixed(1)+'% since earlier snapshot (within 30 days)'}</p><button onclick="editTrade16('${c.id}')">Sell / trade · ${esc(t.status)}</button><button onclick="refreshPrices16('${c.id}')">Refresh price</button></div>`}
function editTrade16(id){let c=state.cards.find(x=>x.id===id),t=trade16(c);if(!c)return;open(`<h2>Sell & trade · ${esc(c.name)}</h2><p>${available16(c)} unassigned copies. Potential sale can include cards still in decks. Physical trade binder and listed copies must be unassigned.</p><label>Status<select id=tradeStatus16>${['None','Potential sale','Available for trade','In trade binder','Listed'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></label><label>Quantity<input id=tradeQty16 type=number min=1 max=${c.qty} value=${t.qty||1}></label><label>Acquisition cost per copy ($)<input id=tradeCost16 type=number min=0 step=.01 value="${esc(t.cost??'')}"></label><label>Asking price per copy ($)<input id=tradeAsk16 type=number min=0 step=.01 value="${esc(t.ask??'')}"></label><button class=primary onclick="saveTrade16('${id}')">Save</button>`)}

function combo174Bind(box){let nav=document.createElement('div');nav.className='combo174Nav';for(let [label,id] of [['Named Pieces','AllNamedPiecesPresent'],['Conditional','ConditionalMatches'],['One Away','OneCardAway'],['Value Engines','Engines']]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>box.querySelector('#combo174-'+id)?.scrollIntoView({block:'start'});nav.append(b)}box.querySelector('h2')?.after(nav);for(let d of box.querySelectorAll('.combo174Details'))d.addEventListener('toggle',async()=>{if(!d.open||d.dataset.loaded||d.dataset.loading)return;let c=d.querySelector('.combo174Content');d.dataset.loading='1';c.textContent='Loading instructions…';try{c.innerHTML=combo174Markup(await combo174Get(d.dataset.variant));d.dataset.loaded='1'}catch(e){c.textContent=e.message+'. Close and reopen to retry.'}finally{delete d.dataset.loading}})}

esc(c.rules)+'</p>':'')+'<p>Live card information unavailable.</p><button type="button">Retry card information</button>';el.querySelector('button').onclick=()=>{delete el.dataset.started;el.textContent='Loading card information…';universal178Load(el)}}}
function universal178Scan(root){if(root.nodeType!==1)return;if(root.matches('.universal178'))universal178Load(root);root.querySelectorAll('.universal178:not([data-started])').forEach(universal178Load);let walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(let n of nodes){let p=n.parentElement;if(!p||p.closest('script,style,textarea,input,select,option,svg,.mana178,[contenteditable]'))continue;let t=n.nodeValue;if(!t||!t.includes('{'))continue;let re=/\{([^{}]+)\}/g,m,last=0,frag=document.createDocumentFragment(),changed=false;while((m=re.exec(t))){if(!universal178Symbol(m[1]))continue;frag.append(t.slice(last,m.index),universal178Icon(m[1]));last=re.lastIndex;changed=true}if(changed){frag.append(t.slice(last));n.replaceWith(frag)}}}
