const $=id=>document.getElementById(id),m=$('modal');let state={cards:[],decks:[]},active='',selected=new Set();try{state=JSON.parse(localStorage.getItem('arcane-v1'))||state}catch(e){}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('arcane-v1',JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup before closing.')}render()}function open(html){m.innerHTML=html;if(!m.open)m.showModal()}function closeM(){m.close()}const closeBtn='<button onclick="closeM()">Close</button>';function image(c){return `<img loading="eager" src="${esc(c.img)}" alt="${esc(c.name)}" onerror="if(this.dataset.retry){this.alt='Image unavailable';return}this.dataset.retry=1;this.src='${esc(c.altimg||c.img)}'">`}function sort148Change(){try{localStorage.setItem('arcane-sort148',$('sort148').value)}catch(e){}render()}

.value='';render()}function addMenu(){open(`<h2>Add cards</h2><div class="addMenu"><button onclick="add()">Search and add a card</button><button onclick="scan()">Photo / bulk scan · V12</button><button onclick="document.getElementById('import').click()">Import collection backup</button></div>${closeBtn}`)}function credits(){open(`<h2>About &amp; Credits</h2><p>Arcane Archive is an unofficial, free, noncommercial Magic: The Gathering fan project.</p><p>Card images, card data and printing information are provided through <a href="https://scryfall.com/" target="_blank" rel="noopener">Scryfall</a>.</p><p>The browser fingerprint implementation and artwork index format interoperate with <a href="https://github.com/gingertonik/cardboard-scanner" target="_blank" rel="noopener">Cardboard Scanner</a> by gingertonik and contributors. See the upstream repository for source and GPL-3.0 license information.</p><p><a href="https://github.com/joeyjunklynn-blip/arcane-archive" target="_blank" rel="noopener">Arcane Archive source repository</a>.</p><p>Magic: The Gathering and related card artwork and trademarks belong to Wizards of the Coast and their respective rights holders. This project is not affiliated with or endorsed by Wizards of the Coast or Scryfall.</p><p><a href="https://company.wizards.com/en/legal/fancontentpolicy" target="_blank" rel="noopener">Wizards Fan Content Policy</a></p>${closeBtn}`)}function add(){open(`<h2>Add a card</h2><form onsubmit="event.preventDefault();searchCards()"><div class=row><input id=search placeholder="Card name, set or collector number" required><button class=primary>Search</button></div></form><p class=muted>Search by name, or use set: and cn: for uncertain printings.</p><label>Assign to deck<select id=singleDeck15>${deckOptions15(active)}</select></label><div id=results></div>${closeBtn}`)}let found=[];async function searchCards(){let s=$('search').value.trim();$('results').textContent='Finding printings…';try{let query=s.includes(':')?s:s.replace(/[’'",.!?]/g," ").trim().split(/\s+/).map(w=>`name:${JSON.stringify(w)}`).join(" ");let url='https://api.scryfall.com/cards/search?unique=prints&q='+encodeURIComponent(query);found=[];for(let i=0;url&&i<5;i++){let r=await fetch(url);let j=await r.json();if(!r.ok){if(i===0&&r.status===404&&!s.includes(':')){let fr=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(s));let fc=await fr.json();if(fr.ok){url='https://api.scryfall.com/cards/search?unique=prints&q='+encodeURIComponent('!'+JSON.stringify(fc.name));continue}}throw Error(j.details||'Search failed');}found.push(...j.data);url=j.has_more?j.next_page:null} $('results').innerHTML=`<p>${found.length} printings</p><div class=grid>`+found.map((c,i)=>`<div class=card onclick="choose(${i})">${image(normal(c))}<strong>${esc(c.name)}</strong>${gcMark(c)}<div class=muted>${esc(c.set_name)} #${esc(c.collector_number)}</div><button>Choose</button></div>`).join('')+'</div>'}catch(e){$('results').textContent='Could not load cards: '+e.message+' Try again in Safari with internet access.'}}function normal(c){let im=c.image_uris||c.card_faces?.[0]?.image_uris||{};return {name:c.name,img:im.normal,altimg:im.large,set:c.set_name,num:c.collector_number,sid:c.id,...metadata(c)}}function choose(i){let c=found[i],dest=$('singleDeck15')?.value??active??'';open(`<h2>${esc(c.name)}</h2><div style="max-width:210px;margin:auto">${image(normal(c))}</div><p>${esc(c.set_name)} #${esc(c.collector_number)}</p><label>Finish<select id=af>${c.finishes.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><label>Condition<select id=ac>${['Near Mint','Lightly Played','Moderately Played','Heavily Played','Damaged'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Quantity<input id=aq type=number min=1 value=1></label><label>Assign to deck<select id=singleDeck15>${deckOptions15(dest)}</select></label><p class=muted>Condition-specific live ranges are not available in this prototype. Printing function commit(i){let c=found[i],finish=$('af').value,condition=$('ac').value,qty=Math.max(1,Math.floor(Number($('aq').value)||1)),p=c.prices?.[finish==='nonfoil'?'usd':finish==='foil'?'usd_foil':'usd_etched'],d=state.decks.find(x=>x.id===$('singleDeck15')?.value),old=state.cards.find(x=>x.sid===c.id&&x.finish===finish&&x.condition===condition);let entry=old||{...normal(c),id:uid(),finish,condition,qty:0,price:p,assign:{}};entry.qty+=qty;entry.price=p;if(!old)state.cards.push(entry);if(d){let current=entry.assign[d.id]||0,add=Math.max(0,Math.min(qty,maxAssign(entry,d)-current));entry.assign[d.id]=current+add;if(add<qty)alert(`${add} assigned; ${qty-add} kept in collection due to copy or availability limits.`)}save();if(scanQueue.length)nextScan();else closeM()}
