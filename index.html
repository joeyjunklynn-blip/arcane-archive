<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Arcane Archive</title><style> *{box-sizing:border-box}body{margin:0;background:#17191c;color:#eee8da;font:16px system-ui}header{position:sticky;top:0;background:#202226;padding:15px;z-index:2;border-bottom:1px solid #665638}h1{font:26px Georgia;color:#e1c18a;margin:0 0 12px}button,input,select{font:inherit;border:1px solid #665638;border-radius:8px;padding:10px;background:#292b30;color:#eee8da}button{cursor:pointer}button.primary{background:#d6b477;color:#211a12;font-weight:bold} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{min-width:0;flex:1}main{padding:16px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.card{position:relative;background:#24262a;border-radius:10px;padding:7px;overflow:hidden}.card img{width:100%;aspect-ratio:0.716;object-fit:contain;border-radius:8px;background:#333}.card button{width:100%;margin-top:5px}.badge{position:absolute;right:8px;top:8px;background:#25202b;border:1px solid gold;border-radius:8px;padding:5px}.muted{color:#b8b2a5;font-size:13px}dialog{background:#202226;color:#eee8da;border:1px solid #8e7448;border-radius:12px;width:min(94vw,720px);max-height:88vh;overflow:auto;padding:18px}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}label select,label input{display:block;width:100%;margin-top:5px}h2{font:24px Georgia;color:#e1c18a}#deckbar{margin:12px 0} .empty{padding:35px 12px;text-align:center;color:#b8b2a5} </style></head><body><header><h1>✦ Arcane Archive</h1><div class=row><input id=q placeholder="Search your collection" oninput="render()"><button onclick="decks()">☰ My Decks</button><button class=primary onclick="add()">+ Add cards</button></div></header><main><div class=row><select id=condition onchange=render()><option value="">All conditions</option><option>Near Mint</option><option>Lightly Played</option><option>Moderately Played</option><option>Heavily Played</option><option>Damaged</option></select><select id=finish onchange=render()><option value="">All finishes</option><option>nonfoil</option><option>foil</option><option>etched</option></select><select id=df onchange=render()></select><button onclick="createDeck()">+ Deck</button><button onclick="bulk()">Bulk assign</button><button onclick="backup()">Export</button><button onclick="document.getElementById('import').click()">Import</button><input type=file id=import hidden accept='.json' onchange=restore(event)></div><h2 id=heading>My Collection</h2><p id=count class=muted></p><div id=grid class=grid></div></main><dialog id=modal></dialog><script>
const $=id=>document.getElementById(id),m=$('modal');let state={cards:[],decks:[]},active='',selected=new Set();try{state=JSON.parse(localStorage.getItem('arcane-v1'))||state}catch(e){}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('arcane-v1',JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup before closing.')}render()}function open(html){m.innerHTML=html;if(!m.open)m.showModal()}function closeM(){m.close()}const closeBtn='<button onclick="closeM()">Close</button>';function image(c){return `<img loading="eager" src="${esc(c.img)}" alt="${esc(c.name)}" onerror="if(this.dataset.retry){this.alt='Image unavailable';return}this.dataset.retry=1;this.src='${esc(c.altimg||c.img)}'">`}function render(){let f=$('df').value;$('df').innerHTML='<option value="">All decks</option><option value="none">Not in a deck</option>'+state.decks.map(d=>`<option value="${d.id}">${esc(d.icon+' '+d.name)}</option>`).join('');$('df').value=f;let a=state.cards.filter(c=>(!active||c.assign?.[active])&&c.name.toLowerCase().includes($('q').value.toLowerCase())&&(!$('condition').value||c.condition===$('condition').value)&&(!$('finish').value||c.finish===$('finish').value)&&(!f||(f==='none'?!Object.values(c.assign||{}).some(Boolean):c.assign?.[f])));$('heading').textContent=active?state.decks.find(d=>d.id===active)?.name||'My Collection':'My Collection';$('count').textContent=`${a.length} entries · ${a.reduce((s,c)=>s+(active?c.assign[active]:c.qty),0)} cards`;$('grid').innerHTML=a.length?a.map(c=>`<div class=card>${image(c)}<span class=badge>${state.decks.filter(d=>c.assign?.[d.id]).map(d=>esc(d.icon)).join('')}</span><strong>${esc(c.name)}</strong><div class=muted>${esc(c.set)} #${esc(c.num)} · ${esc(c.finish)}<br>${esc(c.condition)} · ×${active?c.assign[active]:c.qty}<br>${price(c)}</div><button onclick="detail('${c.id}')">Details</button><label class=muted><input type=checkbox ${selected.has(c.id)?'checked':''} onchange="this.checked?selected.add('${c.id}'):selected.delete('${c.id}')"> Select</label></div>`).join(''):'<div class=empty>No cards here yet. Add cards to begin.</div>'}function price(c){return c.price?`Printing reference: $${esc(c.price)} (not condition-specific)`:'Price unavailable'}function add(){open(`<h2>Add a card</h2><form onsubmit="event.preventDefault();searchCards()"><div class=row><input id=search placeholder="Card name, set or collector number" required><button class=primary>Search</button></div></form><p class=muted>Search by name, or use set: and cn: for uncertain printings.</p><div id=results></div>${closeBtn}`)}let found=[];async function searchCards(){let s=$('search').value.trim();$('results').textContent='Finding printings…';try{let query=s.includes(':')?s:`name:${JSON.stringify(s)}`;let url='https://api.scryfall.com/cards/search?unique=prints&q='+encodeURIComponent(query);found=[];for(let i=0;url&&i<5;i++){let r=await fetch(url);let j=await r.json();if(!r.ok)throw Error(j.details||'Search failed');found.push(...j.data);url=j.has_more?j.next_page:null} $('results').innerHTML=`<p>${found.length} printings</p><div class=grid>`+found.map((c,i)=>`<div class=card onclick="choose(${i})">${image(normal(c))}<strong>${esc(c.name)}</strong><div class=muted>${esc(c.set_name)} #${esc(c.collector_number)}</div><button>Choose</button></div>`).join('')+'</div>'}catch(e){$('results').textContent='Could not load cards: '+e.message+' Try again in Safari with internet access.'}}function normal(c){let im=c.image_uris||c.card_faces?.[0]?.image_uris||{};return {name:c.name,img:im.normal,altimg:im.large,set:c.set_name,num:c.collector_number,sid:c.id}}function choose(i){let c=found[i];open(`<h2>${esc(c.name)}</h2><div style="max-width:210px;margin:auto">${image(normal(c))}</div><p>${esc(c.set_name)} #${esc(c.collector_number)}</p><label>Finish<select id=af>${c.finishes.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><label>Condition<select id=ac>${['Near Mint','Lightly Played','Moderately Played','Heavily Played','Damaged'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Quantity<input id=aq type=number min=1 value=1></label><p class=muted>Condition-specific live ranges are not available in this prototype. Printing reference price is saved when available.</p><button class=primary onclick="commit(${i})">Add to collection</button> <button onclick=add()>Back to search</button>`)}function commit(i){let c=found[i],finish=$('af').value,condition=$('ac').value,qty=Math.max(1,Math.floor(Number($('aq').value)||1)),p=c.prices?.[finish==='nonfoil'?'usd':finish==='foil'?'usd_foil':'usd_etched'];let old=state.cards.find(x=>x.sid===c.id&&x.finish===finish&&x.condition===condition);if(old){old.qty+=qty;old.price=p}else state.cards.push({...normal(c),id:uid(),finish,condition,qty,price:p,assign:{}});save();closeM()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}function createDeck(){open(`<h2>Create deck</h2><label>Name<input id=dn></label><label>Format<select id=fmt><option>Commander</option><option>Standard</option><option>Modern</option><option>Casual</option><option>Other</option></select></label><label>Fantasy icon<select id=di>${['🐉','⚔️','🦄','🌙','☀️','🛡️','🧙','🦇','🌿','💀','👑','🔥','🏰','🪽'].map(x=>`<option>${x}</option>`).join('')}</select></label><button class=primary onclick="if($('dn').value.trim()){state.decks.push({id:uid(),name:$('dn').value.trim(),format:$('fmt').value,icon:$('di').value});save();decks()}">Save deck</button> ${closeBtn}`)}function decks(){open(`<h2>My Decks</h2><button onclick="active='';render();closeM()">All collection</button><p>${state.decks.map(d=>`<button style="display:block;width:100%;margin:8px 0" onclick="active='${d.id}';render();closeM()">${esc(d.icon+' '+d.name)} · ${esc(d.format)} · ${state.cards.reduce((s,c)=>s+(c.assign?.[d.id]||0),0)} cards</button>`).join('')}</p><button class=primary onclick=createDeck()>+ Create deck</button> ${closeBtn}`)}function detail(id){let c=state.cards.find(x=>x.id===id);open(`<h2>${esc(c.name)}</h2><div style="max-width:220px;margin:auto">${image(c)}</div><p>${esc(c.set)} · ${esc(c.condition)} · ${esc(c.finish)} · ${price(c)}</p><label>Owned quantity<input id=editqty type=number min=1 value=${c.qty}></label><button onclick="let c=state.cards.find(x=>x.id==='${id}');let n=Math.max(1,Math.floor(Number($('editqty').value)||1));if(n<Object.values(c.assign).reduce((a,b)=>a+b,0)){alert('Remove deck assignments first');return}c.qty=n;save();detail('${id}')">Save quantity</button><h2>Deck assignments</h2>${state.decks.map(d=>`<label>${esc(d.icon+' '+d.name)}<input type=number min=0 max=${c.qty} value=${c.assign[d.id]||0} onchange="assign('${id}','${d.id}',this.value)"></label>`).join('')||'Create a deck first.'}<button onclick="if(confirm('Remove this card?')){state.cards=state.cards.filter(x=>x.id!=='${id}');save();closeM()}">Remove card</button> ${closeBtn}`)}function assign(id,d,n){let c=state.cards.find(x=>x.id===id);n=Math.max(0,Math.floor(Number(n)||0));if(n+Object.entries(c.assign).filter(([k])=>k!==d).reduce((s,[k,v])=>s+v,0)>c.qty){alert('Not enough unassigned copies');detail(id);return}c.assign[d]=n;save()}function bulk(){if(!selected.size){alert('Select cards using their checkboxes first.');return}open(`<h2>Assign ${selected.size} entries</h2><label>Deck<select id=bd>${state.decks.map(d=>`<option value=${d.id}>${esc(d.name)}</option>`).join('')}</select></label><button onclick="let d=$('bd').value;if(!d)return;let skipped=0;for(let c of state.cards.filter(x=>selected.has(x.id))){if(Object.values(c.assign).reduce((a,b)=>a+b,0)<c.qty)c.assign[d]=(c.assign[d]||0)+1;else skipped++}selected.clear();save();closeM();if(skipped)alert(skipped+' entries had no free copies')">Assign one copy each</button> ${closeBtn}`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='arcane-archive.json';a.click()}async function restore(e){try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.cards)||!Array.isArray(x.decks))throw Error();if(confirm('Replace current collection with backup?')){state=x;active='';save()}}catch{alert('Invalid backup')}}render();</script></body></html>
